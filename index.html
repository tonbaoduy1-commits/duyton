<!-- Basic source-inspection deterrence. Client-side code cannot provide true source secrecy. -->
<script>
(function () {
  "use strict";
  function stop(e) { e.preventDefault(); e.stopPropagation(); return false; }
  document.addEventListener("contextmenu", stop, true);
  document.addEventListener("keydown", function (e) {
    var k = String(e.key || "").toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (e.key === "F12") return stop(e);
    if (mod && (k === "u" || k === "s")) return stop(e);
    if (mod && e.shiftKey && ["i","j","c","k"].includes(k)) return stop(e);
    if (e.metaKey && e.altKey && ["u","i","j","c"].includes(k)) return stop(e);
  }, true);
  document.addEventListener("dragstart", function (e) {
    if (e.target && ["IMG","SVG","CANVAS"].includes(e.target.tagName)) stop(e);
  }, true);
})();
</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3e8e2\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"font-family:Manrope,system-ui,sans-serif;color:#14122E;background:#F5F6FB;min-height:100vh;-webkit-font-smoothing:antialiased\">\n\n  <sc-if value=\"{{ isAuthScreen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,1fr);min-height:100vh\">\n      <div style=\"position:relative;overflow:hidden;background:#13102F\">\n        <div style=\"position:absolute;inset:0\">\n          <image-slot id=\"auth-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a port or vessel photo\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,16,47,.72) 0%,rgba(19,16,47,.45) 45%,rgba(19,16,47,.88) 100%);pointer-events:none\"><\u002Fdiv>\n        <div style=\"position:relative;padding:56px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;pointer-events:none\">\n          <div style=\"display:inline-flex;align-items:center;padding:12px 20px;background:#fff;border-radius:12px;width:fit-content\"><img src=\"bea41e1c-8aaa-4140-918f-8e2698acf517\" alt=\"Seahorse Shipping Corporation\" style=\"height:44px;width:auto;display:block\"><\u002Fdiv>\n          <div style=\"max-width:540px\">\n            <div style=\"font-size:12px;font-weight:800;letter-spacing:.16em;color:#F9B48A\">VIETNAM → USA<\u002Fdiv>\n            <h1 style=\"font-family:Sora,sans-serif;font-size:54px;line-height:1.04;font-weight:600;color:#fff;margin:18px 0 0;letter-spacing:-.03em;text-wrap:balance\">Every rate, every sailing, one portal.<\u002Fh1>\n            <p style=\"margin:20px 0 0;color:rgba(255,255,255,.82);font-size:16px;line-height:1.6;max-width:420px\">Live contract rates from Vietnam and Cambodia to 73 US destinations — built for the Seahorse agent network.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:34px;color:rgba(255,255,255,.6);font-size:13p ;gap:7px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid #F1F2F8\">\n                      <div sc-camel-on-click=\"{{ printPdf }}\" title=\"PDF Print\" style=\"width:38px;height:38px;border-radius:9px;border:1.5px solid #2B2166;background:#fff;color:#2B2166;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#F6F7FB\">\n                        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ exportExcel }}\" title=\"Export Excel\" style=\"width:38px;height:38px;border-radius:9px;border:1.5px solid #0B7A55;background:#fff;color:#0B7A55;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#E7F7F1\">\n                        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4M9 12l6 6M15 12l-6 6\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ submitBooking }}\" style=\"{{ bookingBtnStyle }}\">\n                        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" style=\"flex:0 0 auto\"><path d=\"{{ bookingIcon }}\"><\u002Fpath><\u002Fsvg>{{ bookingLabel }}\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isLclSearch }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"animation:shsFade .3s ease both\">\n                <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;color:#F26B21;margin-bottom:8px\">LESS THAN CONTAINER LOAD<\u002Fdiv>\n                <h1 style=\"font-family:Sora,sans-serif;font-size:29px;font-weight:600;margin:0;letter-spacing:-.02em\">Search LCL Rates<\u002Fh1>\n                <p style=\"margin:7px 0 24px;color:#6B6A85;font-size:15px;max-width:660px\">Weekly consolidations from Ho Chi Minh City and Hai Phong to the major US gateways. Enter your cargo and we calculate the chargeable weight.<\u002Fp>\n\n                <div style=\"max-width:880px\">\n<div style=\"background:#fff;border:1px solid #E9EAF3;border-radius:16px;padding:22px 24px\">\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n                    <div style=\"min-width:0\">\n                      <label style=\"display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0;margin-bottom:6px\">ORIGIN CFS<\u002Flabel>\n                      <sc-raw-select value=\"{{ lclOrigin }}\" sc-camel-on-change=\"{{ setLclOrigin }}\" style=\"width:100%;height:46px;padding:0 12px;border:1px solid #E4E6F0;border-radius:10px;background:#FBFBFE;font-size:14.5px;font-weight:700;color:#14122E;outline:none;cursor:pointer;font-family:Manrope,sans-serif\">\n                        <sc-for list=\"{{ lclOriginOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n                          <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                    <div style=\"min-width:0\">\n                      <label style=\"display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0;margin-bottom:6px\">VIA (PORT OF DISCHARGE)<\u002Flabel>\n                      <sc-raw-select value=\"{{ lclVia }}\" sc-camel-on-change=\"{{ setLclVia }}\" style=\"width:100%;height:46px;padding:0 12px;border:1px solid #E4E6F0;border-radius:10px;background:#FBFBFE;font-size:14.5px;font-weight:700;color:#14122E;outline:none;cursor:pointer;font-family:Manrope,sans-serif\">\n                        <sc-for list=\"{{ lclViaOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                          <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                    <div style=\"min-width:0\">\n                      <label style=\"display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0;margin-bottom:6px\">DESTINATION CFS / DOOR<\u002Flabel>\n                      <sc-raw-select value=\"{{ lclDest }}\" sc-camel-on-change=\"{{ setLclDest }}\" style=\"width:100%;height:46px;padding:0 12px;border:1.5px solid #F26B21;border-radius:10px;background:#fff;font-size:14.5px;font-weight:700;color:#14122E;outline:none;cursor:pointer;font-family:Manrope,sans-serif\">\n                        <sc-for list=\"{{ lclDestOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                          <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px\">\n                    <div>\n                      <label style=\"display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0;margin-bottom:6px\">CARGO READY DATE<\u002Flabel>\n                      <input type=\"date\" value=\"{{ readyDate }}\" sc-camel-on-change=\"{{ setReadyDate }}\" style=\"width:100%;height:44px;padding:0 13px;border:1px solid #E4E6F0;border-radius:10px;background:#FBFBFE;font-size:14px;font-weight:700;color:#14122E;outline:none;font-family:Manrope,sans-serif\">\n                    <\u002Fdiv>\n                    <div>\n                      <label style=\"display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0;margin-bottom:6px\">COMMODITY<\u002Flabel>\n                      <input value=\"{{ commodity }}\" sc-camel-on-change=\"{{ setCommodity }}\" placeholder=\"e.g. Furniture, wooden\" style=\"width:100%;height:44px;padding:0 13px;border:1px solid #E4E6F0;border-radius:10px;background:#FBFBFE;font-size:14px;font-weight:700;color:#14122E;outline:none\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"margin-top:22px\">\n                    <div sc-camel-on-click=\"{{ pkgPanel.toggle }}\" style=\"{{ pkgPanelBtnStyle }}\">\n                      <span style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n                        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"flex:0 0 auto\"><path d=\"M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8\"><\u002Fpath><\u002Fsvg>\n                        <span style=\"font-size:14px;font-weight:800\">PACKAGE DETAILS<\u002Fspan>\n                        <span style=\"font-size:12.5px;font-weight:700;color:#8886A0\">{{ pkgSummary }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"{{ pkgPanel.iconStyle }}\">+<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ pkgPanel.open }}\" hint-placeholder-val=\"{{ false }}\">\n                     <div style=\"margin-top:14px;padding:16px;border:1px solid #EDEEF6;border-radius:12px;background:#FBFBFE\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap\">\n                      <label style=\"font-size:11px;font-weight:800;letter-spacing:.1em;color:#8886A0\">PACKAGE TYPES ({{ packageCount }})<\u002Flabel>\n                      <d enter\">\n                          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px\">\n                            <input value=\"{{ pk.l }}\" sc-camel-on-change=\"{{ pk.setL }}\" style=\"width:100%;height:42px;padding:0 6px;border:1px solid #E4E6F0;border-radius:9px;background:#FBFBFE;font-size:13.5px;font-weight:700;color:#14122E;outline:none;text-align:center\">\n                            <input value=\"{{ pk.w }}\" sc-camel-on-change=\"{{ pk.setW }}\" style=\"width:100%;height:42px;padding:0 6px;border:1px solid #E4E6F0;border-radius:9px;background:#FBFBFE;font-size:13.5px;font-weight:700;color:#14122E;outline:none;text-align:center\">\n                            <input value=\"{{ pk.h }}\" sc-camel-on-change=\"{{ pk.setH }}\" style=\"width:100%;height:42px;padding:0 6px;border:1px solid #E4E6F0;border-radius:9px;background:#FBFBFE;font-size:13.5px;font-weight:700;color:#14122E;outline:none;text-align:center\">\n                          <\u002Fdiv>\n                          <input value=\"{{ pk.kg }}\" sc-camel-on-change=\"{{ pk.setKg }}\" style=\"width:100%;height:42px;padding:0 10px;border:1px solid #E4E6F0;border-radius:9px;background:#FBFBFE;font-size:13.5px;font-weight:700;color:#14122E;outline:none;text-align:right\">\n                          <div style=\"font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;color:#4A4863\">{{ pk.cbm }}<\u002Fdiv>\n                          <div sc-camel-on-click=\"{{ pk.remove }}\" style=\"{{ pk.removeStyle }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n\n                    <div sc-camel-on-click=\"{{ addPackage }}\" style=\"margin-top:11px;height:42px;border:1.5px dashed #D7D9E8;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;color:#4A4863;cursor:pointer\" style-hover=\"border-color:#F26B21;color:#F26B21\">\n                      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add another package type\n                    <\u002Fdiv>\n                     <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:20px\">\n                    <div style=\"padding:13px 14px;border-radius:12px;background:#F6F7FB;min-width:0\">\n                      <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;color:#8886A0\">TOTAL PIECES<\u002Fdiv>\n                      <div style=\"font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px\">{{ totalPieces }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:13px 14px;border-radius:12px;background:#F6F7FB;min-width:0\">\n                      <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;color:#8886A0\">TOTAL VOLUME<\u002Fdiv>\n                      <div style=\"font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px\">{{ totalCbm }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:13px 14px;border-radius:12px;background:#F6F7FB;min-width:0\">\n                      <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;color:#8886A0\">GROSS WEIGHT<\u002Fdiv>\n                      <div style=\"font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px\">{{ totalKg }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:13px 14px;border-radius:12px;background:#FEF6F1;min-width:0\">\n                      <div style=\"font-size:10px;font-weight:800;letter-spacing:.06em;color:#D6560F\">CHARGEABLE<\u002Fdiv>\n                      <div style=\"font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px;color:#D6560F\">{{ chargeable }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid #F1F2F8;flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ goLclResults }}\" style=\"height:46px;padding:0 30px;border:0;border-radius:10px;background:#F26B21;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(242,107,33,.26)\" style-hover=\"background:#D6560F\">Search Rate<\u002Fbutton>\n                    <div sc-camel-on-click=\"{{ toggleLclFav }}\" title=\"Save this lane to Saved Lanes\" style=\"{{ lclFavStyle }}\">\n                      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"{{ lclFavFill }}\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"flex:0 0 auto\"><path d=\"M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <span style=\"flex:1;min-width:0;font-size:13px;color:#6B6A85;font-weight:600\">Chargeable weight is the greater of volume or weight — 1,000 kg counts as 1 W/M.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isLclResults }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"animation:shsFade .3s ease both;max-width:920px\">\n                <div sc-camel-on-click=\"{{ goLcl }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#8886A0;cursor:pointer;margin-bottom:12px\" style-hover=\"color:#F26B21\">\n =\"none\" stroke=\"#0B7A55\" stroke-width=\"1.9\"><path d=\"M4 5h16v10H8l-4 4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div><div style=\"font-size:13.5px;font-weight:800\">Ask for a custom rate<\u002Fdiv><div style=\"font-size:11.5px;color:#8886A0;font-weight:600\">Reply within 4 working hours<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showSupportWidget }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"shs-noprint\" style=\"position:fixed;left:280px;right:0;bottom:0;z-index:70;display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:12px 26px;background:rgba(245,246,251,.94);backdrop-filter:blur(8px);border-top:1px solid #E4E6F0\">\n          <div sc-camel-on-click=\"{{ toggleSupport }}\" style=\"height:44px;padding:0 18px;border-radius:999px;background:#2B2166;color:#fff;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;cursor:pointer;flex:0 0 auto\" style-hover=\"background:#1E1749\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><\u002Fsvg>Need Help?\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024},&quot;startRoute&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;access&quot;,&quot;submitted&quot;,&quot;overview&quot;,&quot;fcl&quot;,&quot;fclResults&quot;,&quot;rateDetail&quot;,&quot;lcl&quot;,&quot;lclResults&quot;,&quot;insurance&quot;,&quot;builder&quot;,&quot;quote&quot;,&quot;messages&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;showSupportWidget&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;}}\">\nconst NAVY = '#1D1749';\n\nconst ICONS = {\n  overview: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',\n  fcl: 'M3 8h18v9H3zM7.5 8v9M12 8v9M16.5 8v9',\n  lcl: 'M4 13h7v7H4zM13 13h7v7h-7zM8.5 4h7v7h-7z',\n  request: 'M4 5h16v10H8l-4 4z',\n  quotes: 'M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h4',\n  saved: 'M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z',\n  insurance: 'M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6z',\n  support: 'M5 13v-2a7 7 0 0 1 14 0v2M4 13h3v6H4zM17 13h3v6h-3z',\n  messages: 'M4 5h16v11H9l-5 4z'\n};\n\nconst GROUP_OF = {\n  overview: 'overview', fcl: 'fcl', fclResults: 'fcl', rateDetail: 'fcl',\n  lcl: 'lcl', lclResults: 'lcl', lclPreview: 'lcl',\n  builder: 'fcl', quote: 'fcl',\n  insurance: 'insurance', messages: 'messages', saved: 'saved'\n};\n\nclass Component extends DCLogic {\n  state = {\n    route: this.props.startRoute || 'login',\n    mode: 'FCL',\n    notifOpen: false,\n    profileOpen: false,\n    supportOpen: false,\n    equip: '40HC',\n    cover: 'allrisk',\n    margin: 10,\n    quoteTab: 'all',\n    reqType: 'FCL',\n    openFaq: 0,\n    thread: 0,\n    toggles: { door: false, ins: true, haz: false },\n    filters: {},\n    lclUnit: 'cm',\n    db: null,\n    fclOrigin: 0,\n    fclDest: 0,\n    fclCommodity: 'FAK',\n    destQuery: '',\n    destOpen: false,\n    equipMenuOpen: false,\n    sortDir: 'asc',\n    panels: {},\n    contactOpen: false,\n    selectedRate: null,\n    readyDate: '2026-09-18',\n    incoterm: 'FOB',\n    insQuery: 'Commercial furniture and office equipment, except antiques',\n    insGroup: 1,\n    insListOpen: false,\n    commodity: 'Furniture, wooden',\n    packages: [\n      { id: 'p1', name: 'Pallet', pieces: '14', l: '120', w: '100', h: '74', kg: '4200' }\n    ],\n    savedLanes: {},\n    insInline: false,\n    printPreview: false,\n    insValue: '86,400',\n    selectedLcl: '',\n    lclOrigins: null,\n    lclDests: null,\n    lclDestQuery: '',\n    lclDestListOpen: false,\n    lclFilters: {},\n    lclSort: 'price',\n    lclOrigin: 0,\n    lclVia: 'all',\n    lclDest: (window.SEAHORSE_LCL ? Math.max(0, window.SEAHORSE_LCL.DESTS.indexOf('Dallas, TX')) : 0),\n    bookingSent: false,\n    addOns: {}\n  };\n\n  go = (route) => () => this.setState({ route, notifOpen: false, profileOpen: false, bookingSent: false });\n\n  chk(on) {\n    return 'width:16px;height:16px;border-radius:5px;flex:0 0 auto;' +\n      (on ? 'background:#2B2166;border:1.5px solid #2B2166;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #2B2166;' : 'background:#fff;border:1.5px solid #D7D9E8;');\n  }\n\n  /** The rate table loads as a classic script from <helmet>, so it also works\n      from a downloaded file:// copy where module imports are blocked. */\n  pickUpDb = (tries) => {\n    if (window.FCL_RATES) { this.setState({ db: window.FCL_RATES }); return; }\n    const n = tries || 0;\n    if (n > 80) { console.warn('rate database did not load'); return; }\n    setTimeout(() => this.pickUpDb(n + 1), 100);\n  };\n\n  componentDidMount() {\n    this.pickUpDb();\n    document.addEventListener('click', this.onDocClick, true);\n  }\n\n  componentWillUnmount() { document.removeEventListener('click', this.onDocClick, true); }\n\n  onDocClick = (e) => {\n    if (!e.target.closest || e.target.closest('[data-combo]')) return;\n    if (this.state.destOpen || this.state.insListOpen || this.state.equipMenuOpen) {\n      this.setState({ destOpen: false, insListOpen: false, equipMenuOpen: false });\n    }\n  };\n\n  EQUIP = [\n    { key: '20DC', col: 7, cap: '28 t · 33 m³' },\n    { key: '40DC', col: 8, cap: '26 t · 67 m³' },\n    { key: '40HC', col: 9, cap: '26 t · 76 m³' },\n    { key: '45HC', col: 10, cap: '26 t · 86 m³' },\n    { key: '20RF', col: 11, cap: 'Reefer · 28 m³' },\n    { key: '40RF', col: 12, cap: 'Reefer · 59 m³' }\n  ];\n\n  CARRIER_COLOR = { 'MATSON SHIPPING': '#0B5FA5', MSC: '#0A2B6B', ZIM: '#0E7A6B', COSCO: '#1D4ED8', WHL: '#0B7A55', ONE: '#C2185B', OOCL: '#B45309' };\n\n  /** Collapsible section header — click to expand. */\n  panel(key, title, openByDefault) {\n    const open = this.state.panels[key] === undefined ? !!openByDefault : this.state.panels[key];\n    return {\n      title, open,\n      toggle: () => this.setState(s => ({ panels: Object.assign({}, s.panels, { [key]: !open }) })),\n      headStyle: 'display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;' +\n        (open ? 'margin-bottom:14px;' : ''),\n      iconStyle: 'width:22px;height:22px;border-radius:7px;background:#F6F7FB;color:#4A4863;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;transition:transform .18s ease;transform:rotate(' + (open ? '45deg' : '0deg') + ')'\n    };\n  }\n\n  carrierLabel(name) { return name === 'MATSON SHIPPING' ? 'Matson' : name; }\n\n  serial(iso) { return Math.round((new Date(iso + 'T00:00:00') - new Date('1899-12-30T00:00:00')) / 86400000); }\n  fromSerial(s) {\n    const d = new Date(Date.UTC(1899, 11, 30) + s * 86400000);\n    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    return d.getUTCDate() + ' ' + mo[d.getUTCMonth()];\n  }\n\n  /** LCL options on the selected lane, priced on chargeable weight (W/M). */\n  /** Selected LCL origins / destinations, defaulting to one each. */\n  lclSelection() {\n    const D = window.SEAHORSE_LCL;\n    const origins = this.state.lclOrigins || [this.state.lclOrigin];\n    const dests = this.state.lclDests || [this.state.lclDest];\n    return {\n      origins: origins.length ? origins : [0],\n      dests: dests.length ? dests : [D ? Math.max(0, D.DESTS.indexOf('Dallas, TX')) : 0]\n    };\n  }\n\n  /** LCL options across every selected lane, priced on chargeable weight (W/M). */\n  lclOptions(wm) {\n    const D = window.SEAHORSE_LCL;\n    if (!D) return [];\n    const sel = this.lclSelection();\n    const opts = [];\n    for (const oi of sel.origins) {\n      for (const di of sel.dests) {\n        for (const r of D.ROWS) {\n          if (r[0] !== oi || r[1] !== di) continue;\n          const pod = D.PODS[r[2]], mode = D.MODES[r[3]];\n          const base = pod.indexOf('Los Angeles') === 0 ? 26 : 32;\n          const days = base + (mode === 'Rail' ? 6 : mode === 'Truck' ? 3 : 0);\n          const amount = Math.max(D.MIN_CHARGE, Math.round(r[6] * wm));\n          opts.push({\n            key: oi + '-' + di + '-' + r[2] + '-' + r[3],\n            origin: oi, dest: di,\n            lane: D.ORIGINS[oi].split(',')[0] + ' → ' + D.DESTS[di],\n            pod: pod, mode: mode, podIdx: r[2],\n            service: 'Weekly consol via ' + pod.split(',')[0] + (mode === 'Direct' ? ' · CFS to CFS' : ' · ' + mode + ' to door'),\n            cutoff: pod.indexOf('Los Angeles') === 0 ? 'Wed 17:00' : 'Tue 15:00',\n            transit: '~' + days + ' days', days: days,\n            wm: r[6], ocean: r[4], ipi: r[5], amount: amount,\n            perWm: '$' + r[6], min: '$' + D.MIN_CHARGE,\n            price: '$' + amount.toLocaleString()\n          });\n        }\n      }\n    }\n    const cheapest = opts.slice().sort((a, b) => a.amount - b.amount)[0];\n    const fastest = opts.slice().sort((a, b) => a.days - b.days)[0];\n    return opts.map(o => Object.assign({}, o, {\n      best: cheapest && o.key === cheapest.key,\n      tag: cheapest && o.key === cheapest.key ? 'BEST PRICE' : (fastest && o.key === fastest.key ? 'FASTEST' : '')\n    }));\n  }\n\n  /** Indicative port-to-door transit in days, derived from discharge port and routing. */\n  transitDays(pod, dest, via) {\n    const p = (pod || '').toLowerCase();\n    const west = ['los angeles', 'long beach', 'oakland', 'seattle', 'tacoma', 'portland'];\n    const gulf = ['houston', 'new orleans', 'mobile'];\n    let d = west.som
